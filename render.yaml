services:
  # ── Yamishop API Sécurisée (WAF + Backend) ──────────────────────────────────
  - type: web
    name: yamishop-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 80
      - key: APP_PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - fromGroup: yamishop-secrets # Maintenant défini au début
    healthCheckPath: /api/health

  # ── Yamishop Frontend (SPA) ────────────────────────────────────────────────
  - type: web
    runtime: static
    name: yamishop-web
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: frontend/dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://yamishop-api.onrender.com https://*.onrender.com;"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

envVarGroups:
  - name: yamishop-secrets
    envVars:
      - key: MONGO_URI
        sync: false   # ⚠️  À définir dans Render Dashboard → Environment Groups
      - key: JWT_SECRET
        sync: false   # ⚠️  À définir dans Render Dashboard → Environment Groups
      - key: ALLOWED_ORIGINS
        sync: false   # ⚠️  À définir dans Render Dashboard → Environment Groups
      - key: EMAIL_USER
        sync: false   # ⚠️  À définir dans Render Dashboard → Environment Groups
      - key: EMAIL_PASS
        sync: false   # ⚠️  À définir dans Render Dashboard → Environment Groups
